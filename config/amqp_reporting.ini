[main]
; Set to false to disable the plugin entirely
enabled = true

[connection]
; AMQP broker URL — supports amqp:// and amqps://
amqp_url = amqp://guest:guest@localhost:5672

; Maximum delay between reconnection attempts (ms)
max_reconnect_delay_ms = 30000

[publishing]
; Topic exchange to publish delivery outcome events to
exchange = mailing.delivery.outcomes

; Maximum events to buffer in memory when AMQP is disconnected
max_queue_size = 100

; Milliseconds to wait for broker acknowledgement before logging a timeout
publish_timeout_ms = 5000

[headers]
; SMTP headers used to extract job and IP tracking IDs (leave empty to disable)
job_id_header = X-Job-Id
ip_id_header = X-Ip-Id
